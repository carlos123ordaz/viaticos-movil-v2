name: viaticos_flutter
description: Aplicación de gestión de viáticos empresariales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP Client
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.3.0

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Image & Camera
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cunning_document_scanner: ^1.4.0
  path_provider: ^2.1.0

  # Voice
  speech_to_text: ^7.0.0

  # OAuth / Web Auth
  flutter_web_auth_2: ^4.0.0

  # Formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
